spring:
  application:
    name: form-dock
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      cleanup-cron: "0 * * * * *"
      initialize-schema: never

formdock:
  bootstrap:
    enabled: ${FORMDOCK_BOOTSTRAP_ENABLED:false}
    email: "${FORMDOCK_BOOTSTRAP_EMAIL:}"
    password: "${FORMDOCK_BOOTSTRAP_PASSWORD:}"
    display-name: "${FORMDOCK_BOOTSTRAP_DISPLAY_NAME:}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

server:
  shutdown: graceful
