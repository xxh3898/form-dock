name: form-dock

services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORMDOCK_DB_NAME:?FORMDOCK_DB_NAME is required}
      POSTGRES_USER: ${FORMDOCK_DB_USERNAME:?FORMDOCK_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${FORMDOCK_DB_PASSWORD:?FORMDOCK_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    image: ${FORMDOCK_API_IMAGE:?FORMDOCK_API_IMAGE is required}
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FORMDOCK_DB_NAME:?FORMDOCK_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${FORMDOCK_DB_USERNAME:?FORMDOCK_DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${FORMDOCK_DB_PASSWORD:?FORMDOCK_DB_PASSWORD is required}
      FORMDOCK_BOOTSTRAP_ENABLED: ${FORMDOCK_BOOTSTRAP_ENABLED:-false}
      FORMDOCK_BOOTSTRAP_EMAIL: ${FORMDOCK_BOOTSTRAP_EMAIL:-}
      FORMDOCK_BOOTSTRAP_PASSWORD: ${FORMDOCK_BOOTSTRAP_PASSWORD:-}
      FORMDOCK_BOOTSTRAP_DISPLAY_NAME: ${FORMDOCK_BOOTSTRAP_DISPLAY_NAME:-}
    networks:
      - application
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    image: ${FORMDOCK_WEB_IMAGE:?FORMDOCK_WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORMDOCK_WEB_PORT:?FORMDOCK_WEB_PORT is required}:8080"
    networks:
      - application
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  application:
  database:
    internal: true

volumes:
  postgres-data:
