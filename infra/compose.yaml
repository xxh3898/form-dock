name: dev-form-dock

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${FORMDOCK_DB_NAME:?FORMDOCK_DB_NAME is required}
      POSTGRES_USER: ${FORMDOCK_DB_USERNAME:?FORMDOCK_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${FORMDOCK_DB_PASSWORD:?FORMDOCK_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${FORMDOCK_DB_PORT:-15433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${FORMDOCK_DB_NAME:?FORMDOCK_DB_NAME is required}
      DB_USERNAME: ${FORMDOCK_DB_USERNAME:?FORMDOCK_DB_USERNAME is required}
      DB_PASSWORD: ${FORMDOCK_DB_PASSWORD:?FORMDOCK_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${FORMDOCK_API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FORMDOCK_WEB_PORT:-18082}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
