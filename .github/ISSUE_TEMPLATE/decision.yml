name: 의사결정
description: 구현 전에 Product 또는 architecture 차단 질문 하나를 해결합니다.
title: "[DECISION] "
body:
  - type: markdown
    attributes:
      value: |
        Decision Issue는 의사결정을 기록하고 검토하며 그 자체로 구현을 승인하지 않습니다.

        결정 결과가 accepted contract 또는 Phase 경계를 바꾸면 별도 구현 Issue를 만들기 전에 관련 ADR/docs를 갱신하고 승인하세요.

  - type: input
    id: current_phase
    attributes:
      label: 현재 Phase
      description: 이 질문으로 작업이 차단된 Phase를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: blocking_question
    attributes:
      label: 차단 질문
      description: 대안에 따라 실질적으로 다른 결과를 만드는 구체적인 질문 하나를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: 제약 조건
      description: accepted Product, domain, technical, operational, security, cost 또는 legal 제약을 나열해 주세요.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 선택지
      description: 실질적으로 다른 선택지를 숨기지 말고 가능한 대안을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: trade_offs
    attributes:
      label: Trade-off
      description: correctness, complexity, compatibility, operation, cost와 reversibility를 비교해 주세요.
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: 권장 결정
      description: 근거와 함께 선택지 하나를 권장하거나 `UNRESOLVED — 이유`를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: architecture_impact
    attributes:
      label: Architecture 영향
      description: component, dependency, API, deployment 또는 compatibility 결과를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: data_migration_impact
    attributes:
      label: Data와 Migration 영향
      description: schema, migration, retention, backup, rollback 또는 data-loss 결과를 설명하거나 `N/A — 이유`를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: security_impact
    attributes:
      label: Security, Session과 CSRF 영향
      description: authentication, authorization, privacy, session, CSRF, origin 또는 threat model 결과를 설명하거나 `N/A — 이유`를 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: adr_required
    attributes:
      label: ADR 필요 여부
      description: 결정이 여러 layer 또는 장기간 유지되는 architecture 영향을 갖는지 선택해 주세요.
      options:
        - "필요"
        - "불필요"
        - "확인 필요"
    validations:
      required: true

  - type: textarea
    id: downstream_impact
    attributes:
      label: 후속 영향
      description: 차단되거나 영향을 받는 Issue, PR slice, 문서, operation과 production gate를 식별해 주세요.
    validations:
      required: true

  - type: textarea
    id: implementation_authorization
    attributes:
      label: 결정 이후 구현 승인
      description: 이 결정 뒤 필요한 별도 contract/ADR/docs 승인과 구현 Issue를 적어 주세요. 여기서 code를 승인하지 마세요.
    validations:
      required: true

  - type: checkboxes
    id: decision_guardrails
    attributes:
      label: 의사결정 Guardrail
      options:
        - label: 이 Decision Issue 자체가 구현을 승인하지 않는다는 점을 이해했습니다.
          required: true
        - label: accepted contract 또는 Phase 변경은 구현 Issue를 만들기 전에 ADR/docs에서 승인합니다.
          required: true
