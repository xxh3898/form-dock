name: Validate

on:
  workflow_call:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.head_ref != 'release-evidence/89-phase-5-c2-artifact-publication' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate backend
        run: ./gradlew --no-daemon clean check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet
      - name: Validate Production Compose contract
        run: |
          set -euo pipefail
          if docker compose \
            --env-file /dev/null \
            -f infra/compose.production.yaml \
            config --quiet >/dev/null 2>&1; then
            printf '%s\n' 'Production Compose unexpectedly accepted missing required inputs.' >&2
            exit 1
          fi

          production_config="$(docker compose \
            --env-file infra/production.env.example \
            -f infra/compose.production.yaml \
            config --format json)"

          jq -e '
            (.services.api.build == null) and
            (.services.web.build == null) and
            (.services.api.ports == null) and
            (.services.postgres.ports == null) and
            (.services.web.ports | length == 1) and
            (.services.web.ports[0].host_ip == "127.0.0.1") and
            (.services.web.ports[0].target == 8080) and
            ((.services.web.networks | keys | sort) == ["application", "edge"]) and
            (.services.web.networks.edge.aliases == ["form-dock-web"]) and
            ((.services.api.networks | keys | sort) == ["application", "database"]) and
            ((.services.postgres.networks | keys) == ["database"]) and
            (.services.api.restart == "unless-stopped") and
            (.services.web.restart == "unless-stopped") and
            (.services.postgres.restart == "unless-stopped") and
            (.services.api.logging.driver == "json-file") and
            (.services.web.logging.driver == "json-file") and
            (.services.postgres.logging.driver == "json-file") and
            (.services.api.logging.options["max-size"] == "10m") and
            (.services.web.logging.options["max-size"] == "10m") and
            (.services.postgres.logging.options["max-size"] == "10m") and
            (.services.api.logging.options["max-file"] == "5") and
            (.services.web.logging.options["max-file"] == "5") and
            (.services.postgres.logging.options["max-file"] == "5") and
            (.services.api.environment.SPRING_PROFILES_ACTIVE == null) and
            (.services.api.environment.SERVER_ADDRESS == "0.0.0.0") and
            (.services.api.environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres:5432/formdock") and
            (.services.api.environment.FORMDOCK_BOOTSTRAP_ENABLED == "false") and
            (.services.postgres.volumes[0].type == "volume") and
            (.services.postgres.volumes[0].source == "postgres-data") and
            (.services.postgres.volumes[0].target == "/var/lib/postgresql") and
            (.networks.database.internal == true) and
            (.networks.edge.external == true) and
            (.networks.edge.name == "edge") and
            (.services.api.image | endswith(":latest") | not) and
            (.services.web.image | endswith(":latest") | not)
          ' <<< "$production_config" >/dev/null
      - name: Validate backup and recovery shell contract
        run: |
          set -euo pipefail
          bash -n \
            infra/backup/common.sh \
            infra/backup/backup.sh \
            infra/backup/verify.sh \
            infra/backup/retention.sh \
            infra/backup/copy-off-host.sh \
            infra/backup/restore-scratch.sh \
            infra/backup/test/recovery-smoke.sh
          test -x infra/backup/backup.sh
          test -x infra/backup/verify.sh
          test -x infra/backup/retention.sh
          test -x infra/backup/copy-off-host.sh
          test -x infra/backup/restore-scratch.sh
          test -x infra/backup/test/recovery-smoke.sh
      - name: Validate delivery, monitoring, and Production operation shell contract
        run: |
          set -euo pipefail
          bash -n \
            infra/delivery/common.sh \
            infra/delivery/validate-state.sh \
            infra/delivery/health-check.sh \
            infra/delivery/stage-isolated.sh \
            infra/delivery/rollback-isolated.sh \
            infra/delivery/test/delivery-smoke.sh \
            infra/delivery/test/published-artifact-smoke.sh \
            infra/monitoring/check-runtime.sh \
            infra/monitoring/test/monitoring-smoke.sh \
            infra/production/common.sh \
            infra/production/preflight.sh \
            infra/production/activate-first.sh \
            infra/production/deploy-release.sh \
            infra/production/forced-command.sh.example \
            infra/production/report-homeops-deployment.sh \
            infra/production/test/preflight-smoke.sh \
            infra/production/test/activate-first-smoke.sh \
            infra/production/test/activate-first-runtime-smoke.sh \
            infra/production/test/deploy-release-smoke.sh \
            infra/production/test/forced-command-smoke.sh \
            infra/cd/classify-change.sh \
            infra/cd/resolve-production-baseline.sh \
            infra/cd/test/classify-change-smoke.sh \
            infra/cd/test/resolve-production-baseline-smoke.sh \
            infra/cd/test/workflow-contract-smoke.sh
          test -x infra/delivery/validate-state.sh
          test -x infra/delivery/health-check.sh
          test -x infra/delivery/stage-isolated.sh
          test -x infra/delivery/rollback-isolated.sh
          test -x infra/delivery/test/delivery-smoke.sh
          test -x infra/delivery/test/published-artifact-smoke.sh
          test -x infra/monitoring/check-runtime.sh
          test -x infra/monitoring/test/monitoring-smoke.sh
          test -x infra/production/preflight.sh
          test -x infra/production/activate-first.sh
          test -x infra/production/deploy-release.sh
          test -x infra/production/forced-command.sh.example
          test -x infra/production/report-homeops-deployment.sh
          test -x infra/production/test/preflight-smoke.sh
          test -x infra/production/test/activate-first-smoke.sh
          test -x infra/production/test/activate-first-runtime-smoke.sh
          test -x infra/production/test/deploy-release-smoke.sh
          test -x infra/production/test/forced-command-smoke.sh
          test -x infra/cd/classify-change.sh
          test -x infra/cd/resolve-production-baseline.sh
          test -x infra/cd/test/classify-change-smoke.sh
          test -x infra/cd/test/resolve-production-baseline-smoke.sh
          test -x infra/cd/test/workflow-contract-smoke.sh
      - name: Validate recurring CD fixtures
        run: |
          set -euo pipefail
          infra/cd/test/classify-change-smoke.sh
          infra/cd/test/resolve-production-baseline-smoke.sh
          infra/cd/test/workflow-contract-smoke.sh
          infra/production/test/forced-command-smoke.sh
          infra/production/test/deploy-release-smoke.sh
      - name: Validate Production preflight fixture
        run: infra/production/test/preflight-smoke.sh
      - name: Validate first Production activation contract
        run: infra/production/test/activate-first-smoke.sh
      - name: Build application images
        run: docker compose --env-file .env.example -f infra/compose.yaml build
      - name: Validate disposable first Production activation runtime
        run: infra/production/test/activate-first-runtime-smoke.sh
      - name: Validate isolated backup and recovery
        run: infra/backup/test/recovery-smoke.sh
      - name: Validate isolated delivery and monitoring
        run: infra/delivery/test/delivery-smoke.sh

  arm64-release:
    name: ARM64 Release Artifact
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' ||
      (github.base_ref == 'dev' &&
      ((startsWith(github.head_ref, 'release-evidence/') &&
      github.head_ref != 'release-evidence/89-phase-5-c2-artifact-publication') ||
      github.head_ref == 'chore/100-production-cd-foundation')))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify native ARM64 runner and exact source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "aarch64"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          docker buildx version
      - name: Build ARM64 release images
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag form-dock-api:arm64 \
            --file backend/Dockerfile \
            backend
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag form-dock-web:arm64 \
            --file frontend/Dockerfile \
            frontend
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg "REVISION=${{ github.event.pull_request.head.sha }}" \
            --tag form-dock-runtime-config:arm64 \
            --file runtime-config.Dockerfile \
            .
      - name: Inspect ARM64 release image metadata
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-api:arm64)"
          api_os="$(docker image inspect --format '{{.Os}}' form-dock-api:arm64)"
          web_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-web:arm64)"
          web_os="$(docker image inspect --format '{{.Os}}' form-dock-web:arm64)"
          runtime_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-runtime-config:arm64)"
          runtime_os="$(docker image inspect --format '{{.Os}}' form-dock-runtime-config:arm64)"
          runtime_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' form-dock-runtime-config:arm64)"

          test "$api_architecture" = "arm64"
          test "$api_os" = "linux"
          test "$web_architecture" = "arm64"
          test "$web_os" = "linux"
          test "$runtime_architecture" = "arm64"
          test "$runtime_os" = "linux"
          test "$runtime_revision" = "$EXPECTED_HEAD_SHA"

          printf 'API image architecture=%s os=%s\n' "$api_architecture" "$api_os"
          printf 'Web image architecture=%s os=%s\n' "$web_architecture" "$web_os"

          {
            printf '%s\n' '## ARM64 Release Artifact'
            printf '%s\n' "- Head SHA: $EXPECTED_HEAD_SHA"
            printf '%s\n' "- Run ID: $GITHUB_RUN_ID"
            printf '%s\n' "- Runner architecture: $RUNNER_ARCH"
            printf '%s\n' '- Emulation/QEMU: not used (native ARM64 runner)'
            printf '%s\n' "- API image: architecture=$api_architecture os=$api_os"
            printf '%s\n' "- Web image: architecture=$web_architecture os=$web_os"
            printf '%s\n' "- Runtime config image: architecture=$runtime_architecture os=$runtime_os revision=$runtime_revision"
            printf '%s\n' '- Image publish: none'
            printf '%s\n' '- Repository Secret usage: none'
            printf '%s\n' '- Production operation: none'
          } >> "$GITHUB_STEP_SUMMARY"

  arm64-publication:
    name: GHCR Publication Evidence
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev' &&
      github.head_ref == 'release-evidence/89-phase-5-c2-artifact-publication' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: v0.4.0
      RELEASE_SHA: 1648047645720e67d5e928345c875dc53a93ff0e
      RELEASE_TREE: 630ea7b38a721874a447022493be7e49d9d42905
      IMAGE_TAG: sha-1648047645720e67d5e928345c875dc53a93ff0e
      API_PACKAGE: form-dock-api
      WEB_PACKAGE: form-dock-web
      API_TAG_REF: ghcr.io/xxh3898/form-dock-api:sha-1648047645720e67d5e928345c875dc53a93ff0e
      WEB_TAG_REF: ghcr.io/xxh3898/form-dock-web:sha-1648047645720e67d5e928345c875dc53a93ff0e
      PUBLICATION_AUTHORITY: issuecomment-5432560272
    steps:
      - name: Check out exact pull request head tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1648047645720e67d5e928345c875dc53a93ff0e
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native runner and exact release provenance
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "aarch64"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C release-source rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C release-source rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          test "$(git -C release-source cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git -C release-source rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$RELEASE_SHA"
          test -z "$(git -C release-source status --porcelain)"
          docker buildx version
      - name: Authenticate exact GHCR publication job
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN" >/dev/null
      - name: Publish once or verify immutable remote artifacts
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          inspect_package_tag() {
            local package="$1"
            local metadata_file="$RUNNER_TEMP/${package}-metadata.json"
            local error_file="$RUNNER_TEMP/${package}-metadata.error"
            local tags_file="$RUNNER_TEMP/${package}-tags.txt"
            local visibility

            if gh api "/users/xxh3898/packages/container/$package" > "$metadata_file" 2> "$error_file"; then
              visibility="$(jq -r '.visibility' "$metadata_file")"
              case "$visibility" in
                public|private|internal) ;;
                *) printf 'Unexpected package visibility for %s.\n' "$package" >&2; return 1 ;;
              esac
              gh api --paginate \
                "/users/xxh3898/packages/container/$package/versions?per_page=100" \
                --jq '.[] | .metadata.container.tags[]?' > "$tags_file"
              if grep -Fxq "$IMAGE_TAG" "$tags_file"; then
                printf 'present|%s\n' "$visibility"
              else
                printf 'absent|%s\n' "$visibility"
              fi
              return
            fi

            if grep -q '(HTTP 404)' "$error_file"; then
              printf 'absent|not-created\n'
              return
            fi

            sed 's/[[:cntrl:]]//g' "$error_file" >&2
            return 1
          }

          verify_remote_image() {
            local reference="$1"
            local component="$2"
            local dockerfile_sha="$3"
            local manifest_json image_json digest

            manifest_json="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}')"
            image_json="$(docker buildx imagetools inspect "$reference" --format '{{json .Image}}')"
            digest="$(jq -r '.digest' <<< "$manifest_json")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq -e '.os == "linux" and .architecture == "arm64"' <<< "$image_json" >/dev/null
            jq -e --arg value "$RELEASE_SHA" '.config.Labels["org.opencontainers.image.revision"] == $value' <<< "$image_json" >/dev/null
            jq -e --arg value "$RELEASE_TAG" '.config.Labels["org.opencontainers.image.version"] == $value' <<< "$image_json" >/dev/null
            jq -e '.config.Labels["org.opencontainers.image.source"] == "https://github.com/xxh3898/form-dock"' <<< "$image_json" >/dev/null
            jq -e --arg value "$RELEASE_TREE" '.config.Labels["io.formdock.release.tree"] == $value' <<< "$image_json" >/dev/null
            jq -e '.config.Labels["io.formdock.publication.issue"] == "89"' <<< "$image_json" >/dev/null
            jq -e --arg value "$PUBLICATION_AUTHORITY" '.config.Labels["io.formdock.publication.authority"] == $value' <<< "$image_json" >/dev/null
            jq -e --arg value "$component" '.config.Labels["io.formdock.image.component"] == $value' <<< "$image_json" >/dev/null
            jq -e --arg value "$dockerfile_sha" '.config.Labels["io.formdock.dockerfile.sha256"] == $value' <<< "$image_json" >/dev/null
            printf '%s\n' "$digest"
          }

          evidence_file='docs/06-quality/phase-5-c2-remote-artifact-publication-evidence.md'
          evidence_recorded=false
          if [ -f "$evidence_file" ]; then
            for field in \
              publicationStatus \
              releaseGitSha \
              releaseTree \
              apiTagRef \
              apiRemoteDigest \
              webTagRef \
              webRemoteDigest; do
              test "$(grep -c "^${field}=" "$evidence_file")" = 1
            done
            recorded_status="$(awk -F= '$1 == "publicationStatus" { print $2 }' "$evidence_file")"
            recorded_release_sha="$(awk -F= '$1 == "releaseGitSha" { print $2 }' "$evidence_file")"
            recorded_release_tree="$(awk -F= '$1 == "releaseTree" { print $2 }' "$evidence_file")"
            recorded_api_ref="$(awk -F= '$1 == "apiTagRef" { print $2 }' "$evidence_file")"
            recorded_api_digest="$(awk -F= '$1 == "apiRemoteDigest" { print $2 }' "$evidence_file")"
            recorded_web_ref="$(awk -F= '$1 == "webTagRef" { print $2 }' "$evidence_file")"
            recorded_web_digest="$(awk -F= '$1 == "webRemoteDigest" { print $2 }' "$evidence_file")"
            test "$recorded_status" = published
            test "$recorded_release_sha" = "$RELEASE_SHA"
            test "$recorded_release_tree" = "$RELEASE_TREE"
            test "$recorded_api_ref" = "$API_TAG_REF"
            test "$recorded_web_ref" = "$WEB_TAG_REF"
            [[ "$recorded_api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$recorded_web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            evidence_recorded=true
          fi

          api_dockerfile_sha="$(sha256sum release-source/backend/Dockerfile | awk '{print $1}')"
          web_dockerfile_sha="$(sha256sum release-source/frontend/Dockerfile | awk '{print $1}')"
          [[ "$api_dockerfile_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$web_dockerfile_sha" =~ ^[0-9a-f]{64}$ ]]

          IFS='|' read -r api_presence api_visibility_before <<< "$(inspect_package_tag "$API_PACKAGE")"
          IFS='|' read -r web_presence web_visibility_before <<< "$(inspect_package_tag "$WEB_PACKAGE")"

          if [ "$evidence_recorded" = true ]; then
            if [ "$api_presence" != present ] || [ "$web_presence" != present ]; then
              printf '%s\n' 'Recorded publication evidence requires both exact remote tags; refusing re-publication.' >&2
              exit 1
            fi
            mode=verified-existing
          elif [ "$api_presence" = absent ] && [ "$web_presence" = absent ]; then
            mode=published

            docker buildx build \
              --platform linux/arm64 \
              --load \
              --tag "$API_TAG_REF" \
              --label "org.opencontainers.image.source=https://github.com/xxh3898/form-dock" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --label "io.formdock.release.tree=$RELEASE_TREE" \
              --label 'io.formdock.publication.issue=89' \
              --label "io.formdock.publication.authority=$PUBLICATION_AUTHORITY" \
              --label 'io.formdock.image.component=api' \
              --label "io.formdock.dockerfile.sha256=$api_dockerfile_sha" \
              --file release-source/backend/Dockerfile \
              release-source/backend
            docker buildx build \
              --platform linux/arm64 \
              --load \
              --tag "$WEB_TAG_REF" \
              --label "org.opencontainers.image.source=https://github.com/xxh3898/form-dock" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --label "io.formdock.release.tree=$RELEASE_TREE" \
              --label 'io.formdock.publication.issue=89' \
              --label "io.formdock.publication.authority=$PUBLICATION_AUTHORITY" \
              --label 'io.formdock.image.component=web' \
              --label "io.formdock.dockerfile.sha256=$web_dockerfile_sha" \
              --file release-source/frontend/Dockerfile \
              release-source/frontend

            test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$API_TAG_REF")" = 'arm64/linux'
            test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$WEB_TAG_REF")" = 'arm64/linux'

            IFS='|' read -r api_recheck _ <<< "$(inspect_package_tag "$API_PACKAGE")"
            IFS='|' read -r web_recheck _ <<< "$(inspect_package_tag "$WEB_PACKAGE")"
            test "$api_recheck" = absent
            test "$web_recheck" = absent

            docker push "$API_TAG_REF"
            docker push "$WEB_TAG_REF"
            docker image rm "$API_TAG_REF" "$WEB_TAG_REF" >/dev/null
          elif [ "$api_presence" = present ] && [ "$web_presence" = present ]; then
            mode=verified-existing
          else
            printf '%s\n' 'Exact publication tags are partial or ambiguous; refusing mutation.' >&2
            exit 1
          fi

          api_digest="$(verify_remote_image "$API_TAG_REF" api "$api_dockerfile_sha")"
          web_digest="$(verify_remote_image "$WEB_TAG_REF" web "$web_dockerfile_sha")"
          api_digest_ref="${API_TAG_REF%:*}@$api_digest"
          web_digest_ref="${WEB_TAG_REF%:*}@$web_digest"

          evidence_status=not-recorded
          if [ "$evidence_recorded" = true ]; then
            test "$recorded_api_digest" = "$api_digest"
            test "$recorded_web_digest" = "$web_digest"
            evidence_status=matched
          fi

          docker pull "$api_digest_ref" >/dev/null
          docker pull "$web_digest_ref" >/dev/null
          api_local_id="$(docker image inspect --format '{{.Id}}' "$api_digest_ref")"
          web_local_id="$(docker image inspect --format '{{.Id}}' "$web_digest_ref")"
          [[ "$api_local_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$web_local_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$api_digest_ref")" = 'arm64/linux'
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$web_digest_ref")" = 'arm64/linux'

          IFS='|' read -r api_final_presence api_visibility <<< "$(inspect_package_tag "$API_PACKAGE")"
          IFS='|' read -r web_final_presence web_visibility <<< "$(inspect_package_tag "$WEB_PACKAGE")"
          test "$api_final_presence" = present
          test "$web_final_presence" = present

          {
            printf 'mode=%s\n' "$mode"
            printf 'api_digest=%s\n' "$api_digest"
            printf 'web_digest=%s\n' "$web_digest"
            printf 'api_digest_ref=%s\n' "$api_digest_ref"
            printf 'web_digest_ref=%s\n' "$web_digest_ref"
            printf 'api_visibility=%s\n' "$api_visibility"
            printf 'web_visibility=%s\n' "$web_visibility"
            printf 'api_local_id=%s\n' "$api_local_id"
            printf 'web_local_id=%s\n' "$web_local_id"
            printf 'api_dockerfile_sha=%s\n' "$api_dockerfile_sha"
            printf 'web_dockerfile_sha=%s\n' "$web_dockerfile_sha"
            printf 'evidence_status=%s\n' "$evidence_status"
            printf 'publication_utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

          printf 'FORMDOCK_PUBLICATION_MODE=%s\n' "$mode"
          printf 'FORMDOCK_PUBLICATION_API_DIGEST=%s\n' "$api_digest"
          printf 'FORMDOCK_PUBLICATION_WEB_DIGEST=%s\n' "$web_digest"
          printf 'FORMDOCK_PUBLICATION_API_VISIBILITY=%s\n' "$api_visibility"
          printf 'FORMDOCK_PUBLICATION_WEB_VISIBILITY=%s\n' "$web_visibility"
          printf 'FORMDOCK_PUBLICATION_EVIDENCE_STATUS=%s\n' "$evidence_status"
          printf 'FORMDOCK_PUBLICATION_REMOTE_OVERWRITE=0\n'
          printf 'FORMDOCK_PUBLICATION_ALIAS_PUSH=0\n'
      - name: Validate published artifacts by digest in disposable staging
        env:
          FORMDOCK_PUBLICATION_API_DIGEST_REF: ${{ steps.publication.outputs.api_digest_ref }}
          FORMDOCK_PUBLICATION_WEB_DIGEST_REF: ${{ steps.publication.outputs.web_digest_ref }}
          FORMDOCK_PUBLICATION_RELEASE_SHA: 1648047645720e67d5e928345c875dc53a93ff0e
        run: infra/delivery/test/published-artifact-smoke.sh
      - name: Record publication evidence summary
        env:
          PUBLICATION_MODE: ${{ steps.publication.outputs.mode }}
          API_DIGEST: ${{ steps.publication.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.publication.outputs.web_digest }}
          API_VISIBILITY: ${{ steps.publication.outputs.api_visibility }}
          WEB_VISIBILITY: ${{ steps.publication.outputs.web_visibility }}
          API_LOCAL_ID: ${{ steps.publication.outputs.api_local_id }}
          WEB_LOCAL_ID: ${{ steps.publication.outputs.web_local_id }}
          API_DOCKERFILE_SHA: ${{ steps.publication.outputs.api_dockerfile_sha }}
          WEB_DOCKERFILE_SHA: ${{ steps.publication.outputs.web_dockerfile_sha }}
          EVIDENCE_STATUS: ${{ steps.publication.outputs.evidence_status }}
          PUBLICATION_UTC: ${{ steps.publication.outputs.publication_utc }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## Phase 5-C2 Remote Artifact Publication'
            printf '%s\n' "- Workflow head SHA: $EXPECTED_HEAD_SHA"
            printf '%s\n' "- Run ID: $GITHUB_RUN_ID"
            printf '%s\n' "- Publication mode: $PUBLICATION_MODE"
            printf '%s\n' "- Publication UTC: $PUBLICATION_UTC"
            printf '%s\n' "- Source release: $RELEASE_TAG / $RELEASE_SHA"
            printf '%s\n' "- Source tree: $RELEASE_TREE"
            printf '%s\n' '- Runner: ubuntu-24.04-arm / native ARM64'
            printf '%s\n' '- Target platform: linux/arm64'
            printf '%s\n' "- API ref: $API_TAG_REF"
            printf '%s\n' "- API digest: $API_DIGEST"
            printf '%s\n' "- API local image ID: $API_LOCAL_ID"
            printf '%s\n' "- API Dockerfile SHA-256: $API_DOCKERFILE_SHA"
            printf '%s\n' "- API package visibility: $API_VISIBILITY"
            printf '%s\n' "- Web ref: $WEB_TAG_REF"
            printf '%s\n' "- Web digest: $WEB_DIGEST"
            printf '%s\n' "- Web local image ID: $WEB_LOCAL_ID"
            printf '%s\n' "- Web Dockerfile SHA-256: $WEB_DOCKERFILE_SHA"
            printf '%s\n' "- Web package visibility: $WEB_VISIBILITY"
            printf '%s\n' '- Pull-by-digest isolated acceptance: PASS'
            printf '%s\n' "- Repository evidence digest match: $EVIDENCE_STATUS"
            printf '%s\n' '- Flyway history: 1,2,3,4,5,6'
            printf '%s\n' '- Moving alias push: 0'
            printf '%s\n' '- Remote overwrite/delete: 0'
            printf '%s\n' '- Production/live mutation: 0'
            printf '%s\n' '- Mac mini build/push: 0'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove GHCR job credential
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
