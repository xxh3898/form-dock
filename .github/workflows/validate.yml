name: Validate

on:
  workflow_call:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate backend
        run: ./gradlew --no-daemon clean check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet
      - name: Validate Production Compose contract
        run: |
          set -euo pipefail
          if docker compose \
            --env-file /dev/null \
            -f infra/compose.production.yaml \
            config --quiet >/dev/null 2>&1; then
            printf '%s\n' 'Production Compose unexpectedly accepted missing required inputs.' >&2
            exit 1
          fi

          production_config="$(docker compose \
            --env-file infra/production.env.example \
            -f infra/compose.production.yaml \
            config --format json)"

          jq -e '
            (.services.api.build == null) and
            (.services.web.build == null) and
            (.services.api.ports == null) and
            (.services.postgres.ports == null) and
            (.services.web.ports | length == 1) and
            (.services.web.ports[0].host_ip == "127.0.0.1") and
            (.services.web.ports[0].target == 8080) and
            ((.services.web.networks | keys | sort) == ["application", "edge"]) and
            (.services.web.networks.edge.aliases == ["form-dock-web"]) and
            ((.services.api.networks | keys | sort) == ["application", "database"]) and
            ((.services.postgres.networks | keys) == ["database"]) and
            (.services.api.restart == "unless-stopped") and
            (.services.web.restart == "unless-stopped") and
            (.services.postgres.restart == "unless-stopped") and
            (.services.api.logging.driver == "json-file") and
            (.services.web.logging.driver == "json-file") and
            (.services.postgres.logging.driver == "json-file") and
            (.services.api.logging.options["max-size"] == "10m") and
            (.services.web.logging.options["max-size"] == "10m") and
            (.services.postgres.logging.options["max-size"] == "10m") and
            (.services.api.logging.options["max-file"] == "5") and
            (.services.web.logging.options["max-file"] == "5") and
            (.services.postgres.logging.options["max-file"] == "5") and
            (.services.api.environment.SPRING_PROFILES_ACTIVE == null) and
            (.services.api.environment.SERVER_ADDRESS == "0.0.0.0") and
            (.services.api.environment.SPRING_DATASOURCE_URL == "jdbc:postgresql://postgres:5432/formdock") and
            (.services.api.environment.FORMDOCK_BOOTSTRAP_ENABLED == "false") and
            (.services.postgres.volumes[0].type == "volume") and
            (.services.postgres.volumes[0].source == "postgres-data") and
            (.services.postgres.volumes[0].target == "/var/lib/postgresql") and
            (.networks.database.internal == true) and
            (.networks.edge.external == true) and
            (.networks.edge.name == "edge") and
            (.services.api.image | endswith(":latest") | not) and
            (.services.web.image | endswith(":latest") | not)
          ' <<< "$production_config" >/dev/null
      - name: Validate backup and recovery shell contract
        run: |
          set -euo pipefail
          bash -n \
            infra/backup/common.sh \
            infra/backup/backup.sh \
            infra/backup/verify.sh \
            infra/backup/retention.sh \
            infra/backup/copy-off-host.sh \
            infra/backup/restore-scratch.sh \
            infra/backup/test/recovery-smoke.sh
          test -x infra/backup/backup.sh
          test -x infra/backup/verify.sh
          test -x infra/backup/retention.sh
          test -x infra/backup/copy-off-host.sh
          test -x infra/backup/restore-scratch.sh
          test -x infra/backup/test/recovery-smoke.sh
      - name: Validate delivery, monitoring, and Production operation shell contract
        run: |
          set -euo pipefail
          bash -n \
            infra/delivery/common.sh \
            infra/delivery/validate-state.sh \
            infra/delivery/health-check.sh \
            infra/delivery/stage-isolated.sh \
            infra/delivery/rollback-isolated.sh \
            infra/delivery/test/delivery-smoke.sh \
            infra/delivery/test/published-artifact-smoke.sh \
            infra/monitoring/check-runtime.sh \
            infra/monitoring/test/monitoring-smoke.sh \
            infra/production/common.sh \
            infra/production/preflight.sh \
            infra/production/activate-first.sh \
            infra/production/deploy-release.sh \
            infra/production/forced-command.sh.example \
            infra/production/report-homeops-deployment.sh \
            infra/production/test/preflight-smoke.sh \
            infra/production/test/activate-first-smoke.sh \
            infra/production/test/activate-first-runtime-smoke.sh \
            infra/production/test/deploy-release-smoke.sh \
            infra/production/test/forced-command-smoke.sh \
            infra/cd/classify-change.sh \
            infra/cd/resolve-production-baseline.sh \
            infra/cd/resolve-artifact-publication.sh \
            infra/cd/test/classify-change-smoke.sh \
            infra/cd/test/resolve-production-baseline-smoke.sh \
            infra/cd/test/artifact-publication-smoke.sh \
            infra/cd/test/workflow-contract-smoke.sh
          test -x infra/delivery/validate-state.sh
          test -x infra/delivery/health-check.sh
          test -x infra/delivery/stage-isolated.sh
          test -x infra/delivery/rollback-isolated.sh
          test -x infra/delivery/test/delivery-smoke.sh
          test -x infra/delivery/test/published-artifact-smoke.sh
          test -x infra/monitoring/check-runtime.sh
          test -x infra/monitoring/test/monitoring-smoke.sh
          test -x infra/production/preflight.sh
          test -x infra/production/activate-first.sh
          test -x infra/production/deploy-release.sh
          test -x infra/production/forced-command.sh.example
          test -x infra/production/report-homeops-deployment.sh
          test -x infra/production/test/preflight-smoke.sh
          test -x infra/production/test/activate-first-smoke.sh
          test -x infra/production/test/activate-first-runtime-smoke.sh
          test -x infra/production/test/deploy-release-smoke.sh
          test -x infra/production/test/forced-command-smoke.sh
          test -x infra/cd/classify-change.sh
          test -x infra/cd/resolve-production-baseline.sh
          test -x infra/cd/resolve-artifact-publication.sh
          test -x infra/cd/test/classify-change-smoke.sh
          test -x infra/cd/test/resolve-production-baseline-smoke.sh
          test -x infra/cd/test/artifact-publication-smoke.sh
          test -x infra/cd/test/workflow-contract-smoke.sh
      - name: Validate recurring CD fixtures
        run: |
          set -euo pipefail
          infra/cd/test/classify-change-smoke.sh
          infra/cd/test/resolve-production-baseline-smoke.sh
          infra/cd/test/artifact-publication-smoke.sh
          infra/cd/test/workflow-contract-smoke.sh
          infra/production/test/forced-command-smoke.sh
          infra/production/test/deploy-release-smoke.sh
      - name: Validate Production preflight fixture
        run: infra/production/test/preflight-smoke.sh
      - name: Validate first Production activation contract
        run: infra/production/test/activate-first-smoke.sh
      - name: Build application images
        run: docker compose --env-file .env.example -f infra/compose.yaml build
      - name: Validate disposable first Production activation runtime
        run: infra/production/test/activate-first-runtime-smoke.sh
      - name: Validate isolated backup and recovery
        run: infra/backup/test/recovery-smoke.sh
      - name: Validate isolated delivery and monitoring
        run: infra/delivery/test/delivery-smoke.sh

  arm64-release:
    name: ARM64 Release Artifact
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' ||
      (github.base_ref == 'dev' &&
      ((startsWith(github.head_ref, 'release-evidence/') &&
      github.head_ref != 'release-evidence/89-phase-5-c2-artifact-publication') ||
      github.head_ref == 'chore/100-production-cd-foundation' ||
      github.head_ref == 'fix/105-reusable-validate-startup-failure')))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify native ARM64 runner and exact source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "aarch64"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          docker buildx version
      - name: Build ARM64 release images
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag form-dock-api:arm64 \
            --file backend/Dockerfile \
            backend
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag form-dock-web:arm64 \
            --file frontend/Dockerfile \
            frontend
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg "REVISION=${{ github.event.pull_request.head.sha }}" \
            --tag form-dock-runtime-config:arm64 \
            --file runtime-config.Dockerfile \
            .
      - name: Inspect ARM64 release image metadata
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-api:arm64)"
          api_os="$(docker image inspect --format '{{.Os}}' form-dock-api:arm64)"
          web_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-web:arm64)"
          web_os="$(docker image inspect --format '{{.Os}}' form-dock-web:arm64)"
          runtime_architecture="$(docker image inspect --format '{{.Architecture}}' form-dock-runtime-config:arm64)"
          runtime_os="$(docker image inspect --format '{{.Os}}' form-dock-runtime-config:arm64)"
          runtime_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' form-dock-runtime-config:arm64)"

          test "$api_architecture" = "arm64"
          test "$api_os" = "linux"
          test "$web_architecture" = "arm64"
          test "$web_os" = "linux"
          test "$runtime_architecture" = "arm64"
          test "$runtime_os" = "linux"
          test "$runtime_revision" = "$EXPECTED_HEAD_SHA"

          printf 'API image architecture=%s os=%s\n' "$api_architecture" "$api_os"
          printf 'Web image architecture=%s os=%s\n' "$web_architecture" "$web_os"

          {
            printf '%s\n' '## ARM64 Release Artifact'
            printf '%s\n' "- Head SHA: $EXPECTED_HEAD_SHA"
            printf '%s\n' "- Run ID: $GITHUB_RUN_ID"
            printf '%s\n' "- Runner architecture: $RUNNER_ARCH"
            printf '%s\n' '- Emulation/QEMU: not used (native ARM64 runner)'
            printf '%s\n' "- API image: architecture=$api_architecture os=$api_os"
            printf '%s\n' "- Web image: architecture=$web_architecture os=$web_os"
            printf '%s\n' "- Runtime config image: architecture=$runtime_architecture os=$runtime_os revision=$runtime_revision"
            printf '%s\n' '- Image publish: none'
            printf '%s\n' '- Repository Secret usage: none'
            printf '%s\n' '- Production operation: none'
          } >> "$GITHUB_STEP_SUMMARY"
